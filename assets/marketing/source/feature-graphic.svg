<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050708"/>
      <stop offset="0.62" stop-color="#0d171a"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.84" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#00bcd4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00bcd4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="750" y="38" width="194" height="431" rx="23"/></clipPath>
    <filter id="drop" x="-50%" y="-40%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.72"/>
    </filter>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#halo)"/>
  <g transform="translate(56 54)">
    <rect width="78" height="78" rx="21" fill="#0a0d0f" stroke="#00bcd4" stroke-width="2"/>
    <image href="../../../app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png" x="-7" y="-7" width="92" height="92"/>
  </g>
  <text x="154" y="90" fill="#f7fafb" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">FileExplorer</text>
  <text x="154" y="119" fill="#73dce7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ANDROID FILE WORKSPACE</text>
  <text x="56" y="230" fill="#f7fafb" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="750">Every file.</text>
  <text x="56" y="292" fill="#21d8e9" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="750">One workspace.</text>
  <text x="58" y="349" fill="#b1bcc0" font-family="Segoe UI, Arial, sans-serif" font-size="20">Local storage, root access, network shares,</text>
  <text x="58" y="380" fill="#b1bcc0" font-family="Segoe UI, Arial, sans-serif" font-size="20">archives, cloud accounts, and security tools.</text>
  <rect x="56" y="420" width="230" height="42" rx="21" fill="#00bcd4"/>
  <text x="171" y="448" text-anchor="middle" fill="#041013" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="750">OPEN SOURCE FOR ANDROID</text>
  <g filter="url(#drop)">
    <rect x="738" y="26" width="218" height="455" rx="32" fill="#050607" stroke="#2bddec" stroke-width="2"/>
    <image href="../../screenshots/storage-analyzer.png" x="750" y="38" width="194" height="431" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen)"/>
  </g>
  <path d="M687 50 L714 50 L714 453 L687 453" fill="none" stroke="#00bcd4" stroke-width="3" opacity="0.55"/>
</svg>
